name: MacRDP
on: 
  workflow_dispatch:
jobs:
  build:
    name: MacRDP
    runs-on: macos-latest
    
    steps:                 
    - name: Enable VNC
      run: |
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "1234" -restart -agent -privs -all
        sudo launchctl kickstart -k system/com.apple.screensharing
        sleep 3
        sudo lsof -i :5900 || echo "Port 5900 not listening"

    - name: Install bore
      run: brew install bore-cli

    - name: Start bore tunnel
      run: bore local 5900 --to bore.pub

    - name: Connection Info
      if: always()
      run: |
        echo "===================================================="
        echo "  Password: 1234"
        echo "  Connect via RealVNC to bore address above"
        echo "===================================================="

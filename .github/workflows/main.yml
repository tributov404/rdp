name: MacRDP
on: 
  workflow_dispatch:
jobs:
  build:
    name: MacRDP
    runs-on: macos-latest
    
    steps:                 
    - name: Create user and Enable VNC
      run: |
        sudo dscl . -create /Users/runneradmin
        sudo dscl . -create /Users/runneradmin UserShell /bin/bash
        sudo dscl . -create /Users/runneradmin RealName Runner_Admin
        sudo dscl . -create /Users/runneradmin UniqueID 1001
        sudo dscl . -create /Users/runneradmin PrimaryGroupID 80
        sudo dscl . -create /Users/runneradmin NFSHomeDirectory /Users/runneradmin
        sudo dscl . -passwd /Users/runneradmin P@ssw0rd!
        sudo createhomedir -c -u runneradmin > /dev/null
        sudo dscl . -append /Groups/admin GroupMembership runneradmin
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -allowAccessFor -allUsers -privs -all -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "P@ssw0rd!"
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent -console
        sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser runneradmin
        sleep 5
        nc -z localhost 5900 && echo "VNC OK" || echo "VNC FAILED"

    - name: Install bore
      run: brew install bore-cli

    - name: Start bore tunnel
      run: bore local 5900 --to bore.pub

    - name: Connection Info
      if: always()
      run: |
        echo "===================================================="
        echo "  Username: runneradmin"
        echo "  Password: P@ssw0rd!"
        echo "  Connect via RealVNC to bore address above"
        echo "===================================================="

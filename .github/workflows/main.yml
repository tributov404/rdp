name: MacRDP VNC Web (Random Password)

on: 
  workflow_dispatch:

jobs:
  build:
    name: MacRDP
    runs-on: macos-latest
    
    steps:                 
    - name: Enable Apple Remote Desktop (VNC)
      run: |
        # Генерируем случайный пароль из 12 символов
        RANDOM_PW=$(LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 12)
        
        # Сохраняем его во временный файл, чтобы передать на следующий шаг
        echo "VNC_PASSWORD=$RANDOM_PW" >> $GITHUB_ENV
        
        # Включаем VNC сервер со случайным паролем
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$RANDOM_PW" -restart -agent -privs -all

    - name: Install Web-VNC Proxy
      run: |
        pip3 install websockify

    - name: Start Ngrok Tunnel and Proxy
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        # 1. Настройка ngrok
        brew install ngrok
        ngrok config add-authtoken "$NGROK_AUTH_TOKEN"
        
        # 2. Запуск веб-прокси для VNC трафика
        nohup websockify 8080 127.0.0.1:5900 > /dev/null 2>&1 &
        
        # 3. Привязка к вашему бесплатному HTTP-домену
        nohup ngrok http 8080 --domain=awry-garland-provoking.ngrok-free.dev > /dev/null 2>&1 &
        
        # 4. Вывод данных для подключения в логи
        echo "===================================================="
        echo "ДАННЫЕ ДЛЯ ПОДКЛЮЧЕНИЯ ЧЕРЕЗ noVNC:"
        echo "Host: awry-garland-provoking.ngrok-free.dev"
        echo "Port: 443"
        echo "Protocol: wss"
        echo "----------------------------------------------------"
        echo "ВАШ СЛУЧАЙНЫЙ ПАРОЛЬ: ${{ env.VNC_PASSWORD }}"
        echo "===================================================="
        
        # Удержание машины активной (6 часов)
        sleep 21600

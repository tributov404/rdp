name: MacRDP
on: 
  workflow_dispatch:
jobs:
  build:
    name: MacRDP
    runs-on: macos-latest
    
    steps:                 
    - name: Enable VNC
      run: |
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "Qwerty1234" -restart -agent -privs -all
        sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAlwaysStartOnConsole -bool true
        sudo launchctl kickstart -k system/com.apple.screensharing

    - name: Install noVNC + websockify
      run: |
        pip3 install websockify --break-system-packages
        git clone https://github.com/novnc/noVNC.git /tmp/noVNC

    - name: Start VNC + noVNC + Cloudflare Tunnel
      run: |
        websockify --web /tmp/noVNC 6080 127.0.0.1:5900 &
        curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz | tar xz -C /tmp
        /tmp/cloudflared tunnel --url http://localhost:6080

    - name: Connection Info
      if: always()
      run: |
        echo "===================================================="
        echo "  Username: runner"
        echo "  Password: Qwerty1234"
        echo "  Open the cloudflared URL in browser"
        echo "===================================================="

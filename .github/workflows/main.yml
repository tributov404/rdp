name: MacRDP
on: 
  workflow_dispatch:
jobs:
  build:
    name: MacRDP
    runs-on: macos-latest
    
    steps:                 
    - name: Enable VNC
      run: |
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -privs -all -clientopts -setvnclegacy -vnclegacy yes
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -clientopts -setvncpw -vncpw "1234"
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent
        sleep 3
        nc -z localhost 5900 && echo "VNC OK" || echo "VNC FAILED"

    - name: Install bore
      run: brew install bore-cli

    - name: Start bore tunnel
      run: bore local 5900 --to bore.pub

    - name: Connection Info
      if: always()
      run: |
        echo "===================================================="
        echo "  Password: 1234"
        echo "===================================================="
